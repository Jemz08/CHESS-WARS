  <script>
    // Prevent Service Worker 404 interception inside native Android Capacitor WebView
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isAndroidWv = ua.indexOf('; wv)') !== -1 || Boolean(window.Capacitor);
        var isCapLocal =
          (location.hostname === 'localhost' || location.hostname.endsWith('.localhost')) &&
          location.port === '';
        if ((isAndroidWv || isCapLocal) && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
      } catch (e) {}
    })();
  </script>
</head>

</body>
