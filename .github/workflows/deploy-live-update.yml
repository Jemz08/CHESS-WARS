name: Build & Publish Live OTA Game Update to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_publish_ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Stamp public/version.json with GitHub Commit SHA & Pages URL
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_SHA_SHORT: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const versionPath = path.resolve("public/version.json");
            let existing = {};
            if (fs.existsSync(versionPath)) {
              try { existing = JSON.parse(fs.readFileSync(versionPath, "utf8")); } catch {}
            }
            const sha = (process.env.GITHUB_SHA_SHORT || "").slice(0, 8) || ("gh-" + Date.now());
            const owner = process.env.REPO_OWNER || "";
            const repoName = process.env.REPO_NAME || "";
            const pagesUrl = owner && repoName ? `https://${owner}.github.io/${repoName}/` : "";
            const nextVersion = {
              ...existing,
              version: existing.version || "1.0.4",
              buildId: `gh-${sha}-${Date.now()}`,
              commitSha: sha,
              branch: process.env.GITHUB_REF_NAME || "main",
              githubRepo: process.env.GITHUB_REPO || existing.githubRepo || "",
              liveUrl: existing.liveUrl || pagesUrl,
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync(versionPath, JSON.stringify(nextVersion, null, 2) + "\n", "utf8");
            console.log("Stamped public/version.json:", nextVersion);
          '

      - name: Build production web bundle
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_GITHUB_BRANCH: ${{ github.ref_name }}
        run: npx vite build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages OTA
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
